name: ibnzaidon
description: "Ibn Zaidon Educational Academy - student app"
publish_to: 'none'
version: 1.0.0+17

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.7
  fpdart: ^1.1.1

  # DI
  get_it: ^8.0.3

  # Network
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4

  # Routing
  go_router: ^16.0.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.1
  confetti: ^0.8.0
  intl: ^0.20.2

  # Media
  youtube_player_iframe: ^5.2.1
  pdfx: ^2.9.2
  url_launcher: ^6.3.1
  share_plus: ^11.0.0
  image_picker: ^1.1.2
  wakelock_plus: ^1.3.2
  screen_protector: ^1.5.3

  # Push
  firebase_core: ^4.4.0
  firebase_messaging: ^16.3.0
  firebase_crashlytics: ^5.0.7
  flutter_local_notifications: ^21.0.0

  # Payments
  in_app_purchase: ^3.2.3
  in_app_purchase_storekit: ^0.4.11

  # Device
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/
